# ============================================================
# ملف: codemagic.yaml
# تطبيق CarDiagnosticAI Pro - نسخة البناء السريعة والمبسطة
# ============================================================

workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: macmini_m2 # يعتمد على السيرفر السريع اللي اخترتيه أول مرة
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build APK (نسخة الهاتف للتجربة)
        script: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="اكتب_هنا_الـ_API_KEY_ديالك_نيشان" \
            --build-name=1.0.0 \
            --build-number=1

      - name: Build AAB (النسخة النهائية للمتجر)
        script: |
          flutter build appbundle --release \
            --dart-define=GEMINI_API_KEY="اكتب_هنا_الـ_API_KEY_ديالك_نيشان" \
            --build-name=1.0.0 \
            --build-number=1

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

    publishing:
      email:
        recipients:
          - your-email@example.com # تقدر تبدل هاد الإيميل بإيميلك باش يصيفطو ليك مسج فاش يسالي
        notify:
          success: true
          failure: true