name: car_diagnostic_ai
description: Car Diagnostic AI with predictive alerts, parts lifespan, SOS, and AI analysis.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.13
  google_generative_ai: ^0.4.6
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.5
  intl: ^0.19.0

flutter:
  uses-material-design: true